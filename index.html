<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0a0c" />
    <title>吉普赛之眼 · 暗夜记忆塔罗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0b0a0c;
            --card: #141013;
            --gold: #d9946b;
            --copper: #b77e5e;
            --text: #ebd6c2;
            --text2: #8f7a6b;
            --border: #3f2e2a;
            --purple: #9b59b6;
        }
        body {
            background: var(--bg);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text);
            padding: 1rem;
            overflow-x: hidden;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }
        .app-container {
            background: rgba(18, 14, 16, 0.9);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid var(--border);
            position: relative;
            z-index: 1;
        }
        .header {
            text-align: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 4px;
        }
        .header h1 span {
            color: var(--gold);
        }
        .toolbar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1rem;
        }
        .btn {
            background: linear-gradient(135deg, #2d1f1d, #1f181b);
            border: 1px solid var(--border);
            color: var(--text2);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.8rem;
        }
        .btn:hover,
        .btn.active {
            border-color: var(--copper);
            color: var(--text);
            box-shadow: 0 0 10px rgba(168, 95, 58, 0.3);
        }
        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .search-input {
            flex: 1;
            background: rgba(31, 24, 27, 0.8);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            color: var(--text);
            outline: none;
        }
        .search-input:focus {
            border-color: var(--copper);
            box-shadow: 0 0 10px rgba(168, 95, 58, 0.2);
        }
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 0.8rem;
        }
        .card {
            background: var(--card);
            border-radius: 12px 6px 12px 6px;
            padding: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #2f2324;
            text-align: center;
            position: relative;
        }
        .card:hover {
            transform: scale(1.05) translateY(-3px);
            border-color: var(--copper);
            box-shadow: 0 5px 20px rgba(168, 95, 58, 0.2);
        }
        .card.favorite::after {
            content: '★';
            position: absolute;
            top: -5px;
            right: -5px;
            color: var(--gold);
            font-size: 1rem;
        }
        .card-img {
            width: 100%;
            aspect-ratio: 2/3;
            border-radius: 8px 3px 8px 3px;
            overflow: hidden;
            background: #1c1618;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-emoji {
            font-size: 2.5rem;
        }
        .card-name {
            font-size: 0.7rem;
            color: var(--text2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }
        .draw-area {
            text-align: center;
            padding: 2rem;
        }
        .deck {
            width: 140px;
            height: 200px;
            background: linear-gradient(135deg, #2d1f1d, #1f181b);
            border: 2px solid var(--copper);
            border-radius: 12px;
            margin: 0 auto 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .deck:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(168, 95, 58, 0.3);
        }
        .deck.shuffling {
            animation: shuffle 0.5s ease-in-out;
        }
        @keyframes shuffle {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-10px) rotate(-3deg);
            }
            75% {
                transform: translateX(10px) rotate(3deg);
            }
        }
        .deck-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .deck-count {
            font-size: 0.8rem;
            color: var(--text2);
        }
        .draw-result {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .draw-card {
            width: 120px;
            animation: drawPop 0.5s ease-out;
        }
        @keyframes drawPop {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(-30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .history-item {
            background: rgba(31, 24, 27, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .history-item:hover {
            border-color: var(--copper);
            background: rgba(45, 31, 29, 0.8);
        }
        .history-date {
            font-size: 0.7rem;
            color: var(--text2);
            margin-bottom: 0.5rem;
        }
        .history-cards {
            display: flex;
            gap: 0.5rem;
        }
        .history-card-mini {
            width: 50px;
            height: 75px;
            border-radius: 6px;
            overflow: hidden;
            background: #1c1618;
        }
        .history-card-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            padding: 1rem;
            overflow-y: auto;
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: linear-gradient(135deg, #121011, #1a1318);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid var(--border);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(45, 31, 29, 0.8);
            border: 1px solid var(--border);
            color: var(--text2);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
        }
        .modal-close:hover {
            background: var(--copper);
            color: #fff;
            transform: rotate(90deg);
        }
        .detail-img {
            width: 100%;
            max-width: 250px;
            margin: 0 auto 1rem;
            border-radius: 12px;
            overflow: hidden;
        }
        .detail-img img {
            width: 100%;
            display: block;
        }
        .detail-title {
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 1rem;
            color: var(--gold);
        }
        .detail-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .info-item {
            background: rgba(27, 21, 23, 0.8);
            padding: 0.5rem;
            border-radius: 8px;
            font-size: 0.8rem;
        }
        .info-label {
            color: var(--text2);
            font-size: 0.7rem;
        }
        .desc-box {
            background: rgba(15, 12, 13, 0.8);
            padding: 1rem;
            border-radius: 8px;
            border-left: 3px solid var(--copper);
            line-height: 1.6;
            margin-bottom: 1rem;
        }
        .desc-box.reversed {
            border-left-color: #9b59b6;
            background: rgba(155, 89, 182, 0.1);
        }
        .detail-actions {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .detail-btn {
            flex: 1;
            background: linear-gradient(135deg, #2d1f1d, #1f181b);
            border: 1px solid var(--border);
            color: var(--text2);
            padding: 0.5rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .detail-btn:hover {
            border-color: var(--copper);
            color: var(--text);
        }
        .detail-btn.active {
            background: var(--copper);
            color: #fff;
        }
        .note-box {
            margin-top: 1rem;
        }
        .note-box textarea {
            width: 100%;
            background: rgba(31, 24, 27, 0.8);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
            color: var(--text);
            min-height: 80px;
            resize: vertical;
            font-family: inherit;
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(45, 31, 29, 0.95);
            border: 1px solid var(--copper);
            color: var(--text);
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            font-size: 0.85rem;
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        @media (max-width:600px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            }
            .header h1 {
                font-size: 1.2rem;
            }
        }
        .element-fire {
            background: rgba(230, 126, 34, 0.2);
            border-color: #e67e22;
            color: #e67e22;
        }
        .element-air {
            background: rgba(149, 165, 166, 0.2);
            border-color: #95a5a6;
            color: #95a5a6;
        }
        .element-water {
            background: rgba(52, 152, 219, 0.2);
            border-color: #3498db;
            color: #3498db;
        }
        .element-earth {
            background: rgba(212, 165, 116, 0.2);
            border-color: #d4a574;
            color: #d4a574;
        }
        .position-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }
        .position-tab {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text2);
            padding: 0.5rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .position-tab.active {
            background: var(--copper);
            color: #fff;
            border-color: var(--copper);
        }
        .position-tab.reversed-tab.active {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            border-color: #9b59b6;
        }
        .reversed img {
            transform: rotate(180deg);
        }
        .reversed-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            z-index: 10;
        }
        .reversed-indicator {
            display: none;
            text-align: center;
            color: #9b59b6;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            padding: 0.3rem;
            background: rgba(155, 89, 182, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(155, 89, 182, 0.3);
        }
        .element-display {
            margin-bottom: 1rem;
            padding: 1rem;
            background: rgba(15, 12, 13, 0.5);
            border-radius: 8px;
        }
        .element-display h4 {
            color: var(--gold);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .element-pair {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .element-box {
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            border: 1px solid;
            font-size: 0.8rem;
        }
        .element-mix-desc {
            color: var(--text2);
            font-size: 0.75rem;
            font-style: italic;
            padding-left: 0.5rem;
        }
        .card-elements {
            display: flex;
            gap: 0.2rem;
            justify-content: center;
            margin-top: 0.3rem;
        }
        .element-tag {
            font-size: 0.6rem;
            padding: 1px 4px;
            border-radius: 8px;
            border: 1px solid;
        }
        .library-btn {
            background: linear-gradient(135deg, #2d1f1d, #1f181b);
            border: 1px solid var(--border);
            color: var(--text2);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }
        .library-btn:hover {
            border-color: var(--copper);
            color: var(--text);
            box-shadow: 0 0 10px rgba(168, 95, 58, 0.3);
        }
        .library-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10001;
            padding: 1rem;
            overflow-y: auto;
        }
        .library-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .library-content {
            background: linear-gradient(135deg, #121011, #1a1318);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid var(--border);
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .library-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        .library-tab {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text2);
            padding: 0.4rem 0.8rem;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.75rem;
        }
        .library-tab:hover,
        .library-tab.active {
            border-color: var(--copper);
            color: var(--text);
            background: rgba(168, 95, 58, 0.1);
        }
        .library-section {
            display: none;
        }
        .library-section.active {
            display: block;
        }
        .number-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 0.8rem;
        }
        .number-card {
            background: rgba(31, 24, 27, 0.8);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            transition: all 0.3s;
        }
        .number-card:hover {
            border-color: var(--copper);
            transform: translateY(-2px);
        }
        .number-value {
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 0.3rem;
        }
        .number-meaning {
            font-size: 0.75rem;
            color: var(--text);
        }
        .number-keywords {
            font-size: 0.65rem;
            color: var(--text2);
            margin-top: 0.3rem;
        }
        .element-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .element-card {
            background: rgba(31, 24, 27, 0.8);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            transition: all 0.3s;
        }
        .element-card:hover {
            border-color: var(--copper);
        }
        .element-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .element-icon {
            font-size: 1.5rem;
        }
        .element-title {
            color: var(--gold);
            font-weight: bold;
        }
        .element-assoc {
            font-size: 0.7rem;
            color: var(--text2);
            margin-top: 0.3rem;
        }
        .zodiac-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }
        .zodiac-item {
            background: rgba(31, 24, 27, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
            text-align: center;
            font-size: 0.75rem;
        }
        .zodiac-symbol {
            font-size: 1.2rem;
            margin-bottom: 0.2rem;
        }
        .zodiac-name {
            color: var(--text);
        }
        .zodiac-date {
            font-size: 0.6rem;
            color: var(--text2);
        }
        .symbol-search {
            margin-bottom: 1rem;
        }
        .symbol-search input {
            width: 100%;
            background: rgba(31, 24, 27, 0.8);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            color: var(--text);
            outline: none;
        }
        .symbol-search input:focus {
            border-color: var(--copper);
        }
        .symbol-results {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .symbol-result {
            background: rgba(31, 24, 27, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .symbol-result:hover {
            border-color: var(--copper);
            background: rgba(45, 31, 29, 0.8);
        }
        .symbol-match {
            color: var(--gold);
            font-weight: bold;
        }
        .close-scroll-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--copper), #8b5a3c);
            border: none;
            color: #fff;
            padding: 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .close-scroll-btn:hover {
            background: linear-gradient(135deg, var(--gold), var(--copper));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(168, 95, 58, 0.3);
        }
        .related-cards {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        .related-title {
            color: var(--gold);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .related-grid {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .symbol-chip {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.6rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid var(--border);
            margin-bottom: 0.4rem;
            text-align: left;
            width: 100%;
        }
        .symbol-chip:hover {
            transform: translateX(4px);
        }
        .chip-link:hover {
            border-color: var(--copper);
            background: rgba(168, 95, 58, 0.1);
        }
        .chip-material:hover {
            border-color: var(--text2);
            background: rgba(139, 122, 110, 0.08);
        }
        .chip-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .chip-text {
            flex: 1;
            min-width: 0;
        }
        .chip-name {
            font-size: 0.8rem;
            color: var(--text);
            font-weight: 500;
        }
        .chip-type {
            font-size: 0.55rem;
            color: var(--text2);
            margin-top: 1px;
        }
        .chip-others {
            font-size: 0.6rem;
            color: var(--text2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
            flex-shrink: 0;
        }
        .chip-link .chip-name {
            color: var(--copper);
        }
        .symbol-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

            { type: '关联库', symbol: '王冠（尖顶/三重冠）', cards: ['教皇', '战车'], meaning: '同款三重冠，精神与世俗结合' },
            { type: '关联库', symbol: '王冠（星冠）', cards: ['战车', '星星'], meaning: '同款星冠，宇宙指引与胜利' },
            { type: '关联库', symbol: '帆船', cards: ['权杖三', '星币二', '圣杯国王', '宝剑六'], meaning: '同款帆船，旅程与过渡' },
            { type: '关联库', symbol: '天平', cards: ['正义', '星币六'], meaning: '同款天平，公正与平衡' },

            { type: '素材库', symbol: '山脉', cards: ['愚人', '隐士', '恋人', '皇帝', '节制', '审判', '权杖侍从', '权杖骑士', '星币Ace',
                    '星币侍从'
                ], meaning: '险阻、远方、蓄势、超越' },
            { type: '素材库', symbol: '河流/水流', cards: ['皇后', '节制', '月亮', '审判', '圣杯Ace', '圣杯八', '圣杯骑士'],
                meaning: '潜意识流动、过渡、远方' },
            { type: '素材库', symbol: '小径', cards: ['愚人', '隐士', '月亮', '节制'], meaning: '人生道路、追寻' },
            { type: '素材库', symbol: '海/浪', cards: ['宝剑二', '星币二'], meaning: '情感起伏、潜意识波动' },
            { type: '素材库', symbol: '太阳', cards: ['太阳', '恋人', '死神', '节制'], meaning: '意识、生命之源、启迪' },
            { type: '素材库', symbol: '月亮', cards: ['女祭司', '月亮', '圣杯八'], meaning: '直觉、潜意识、暗中之光' },
            { type: '素材库', symbol: '星星', cards: ['星星', '战车', '皇后'], meaning: '希望、指引、天命' },
            { type: '素材库', symbol: '云', cards: ['愚人', '审判', '圣杯四', '圣杯七', '宝剑侍从', '宝剑骑士'],
            meaning: '思绪、迷雾、神圣遮蔽' },
            { type: '素材库', symbol: '城堡', cards: ['权杖Ace', '权杖二', '权杖四', '圣杯五', '圣杯六', '星币四', '星币十', '星币国王'],
                meaning: '安全感、归宿、成就' }
        ];

        // ---------- 牌阵定义 ----------
        const SPREAD_DEFS = {
            three: {
                label: '三牌阵',
                count: 3,
                slots: ['过去', '现在', '未来'],
                meanings: ['已发生之事，造就当下的因', '此刻之局，需直面之境', '即将显现，可望之势'],
                desc: '过去-现在-未来，线性时间之镜'
            },
            celtic: {
                label: '凯尔特十字',
                count: 10,
                slots: ['当下', '阻挡', '根基', '过去', '未来', '上方', '下方', '建议', '他人', '结局'],
                meanings: ['当前位置', '面对的障碍', '内在基石', '近因', '发展趋势', '理想/意识', '潜意识/恐惧', '行动指引', '外部影响',
                    '最终结果'
                ],
                desc: '十张牌构成十字与权杖，全景式深层解读'
            },
            relationship: {
                label: '关系牌阵',
                count: 6,
                slots: ['你', '对方', '关系现状', '你的期望', '对方的期望', '发展可能'],
                meanings: ['你在关系中的状态', '对方的状态', '当前关系的能量', '你渴望的图景', '对方渴望的图景', '关系走向的种子'],
                desc: '双人视角，照见关系中的光与影'
            },
            seven: {
                label: '七张牌',
                count: 7,
                slots: ['问题', '阻碍', '助力', '态度', '环境', '行动', '结果'],
                meanings: ['核心议题', '面对的挑战', '可借助的力量', '你的应对姿态', '外部环境', '应采取的步骤', '最终的走向'],
                desc: '七阶路径，从问题到结果的完整脉络'
            }
        };

        // ============================================================
        //  2. 工具函数（复用）
        // ============================================================
        function getDualElements(card) {
            const primary = card.element;
            let secondary = null;
            if (['侍从', '骑士', '王后', '国王'].includes(card.number)) {
                secondary = RANK_ELEMENT[card.number];
            }
            return { primary, secondary };
        }

        function getMixElementDesc(primary, secondary) {
            if (!secondary) return null;
            const key = primary + '+' + secondary;
            return MIX_ELEMENT_DESC[key] || `${primary}与${secondary}的融合`;
        }

        function switchPosition(pos) {
            currentPosition = pos;
            document.getElementById('uprightTab').classList.toggle('active', pos === 'upright');
            document.getElementById('reversedTab').classList.toggle('active', pos === 'reversed');
            const imgContainer = document.getElementById('detailImgContainer');
            const indicator = document.getElementById('reversedIndicator');
            const descBox = document.getElementById('modalDesc');
            if (pos === 'reversed') {
                imgContainer.classList.add('reversed');
                indicator.style.display = 'block';
                descBox.classList.add('reversed');
                descBox.innerHTML = `<strong>${currentCard.name} · 逆位</strong> — ${currentCard.reverseDesc}`;
            } else {
                imgContainer.classList.remove('reversed');
                indicator.style.display = 'none';
                descBox.classList.remove('reversed');
                descBox.innerHTML = `<strong>${currentCard.name} · 正位</strong> — ${currentCard.desc}`;
            }
        }

        function getTypeName(type) {
            const names = { major: '大阿卡纳', wands: '权杖', cups: '圣杯', swords: '宝剑', pentacles: '星币' };
            return names[type] || type;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (toastTimer) clearTimeout(toastTimer);
            toast.textContent = msg;
            toast.classList.add('show');
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ============================================================
        //  3. 基础 UI 绑定（与原版一致）
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            initParticles();
            bindEvents();
            renderGrid();
            renderHistory();
            checkDailyCard();
            loadAISetup();
            // 牌阵默认
            document.querySelectorAll('.spread-selector .btn').forEach(b => {
                b.addEventListener('click', function() {
                    document.querySelectorAll('.spread-selector .btn').forEach(x => x.classList.remove(
                    'active'));
                    this.classList.add('active');
                    currentSpread = this.dataset.spread;
                    const def = SPREAD_DEFS[currentSpread];
                    document.getElementById('spreadCount').textContent = def.count + ' 张';
                    document.getElementById('spreadResult').innerHTML = '';
                    document.getElementById('spreadInterp').style.display = 'none';
                    document.getElementById('aiPanel').classList.remove('active');
                });
            });
            // 默认激活第一个牌阵
            document.querySelector('.spread-selector .btn')?.classList.add('active');
            const def = SPREAD_DEFS['three'];
            document.getElementById('spreadCount').textContent = def.count + ' 张';
        });

        function initParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(p);
            }
        }

        function bindEvents() {
            document.querySelectorAll('[data-view]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const view = e.target.dataset.view;
                    switchView(view);
                });
            });
            document.querySelectorAll('[data-filter]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const filter = e.target.dataset.filter;
                    setFilter(filter);
                });
            });
            const searchInput = document.getElementById('searchInput');
            let debounceTimer;
            searchInput.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => renderGrid(), 300);
            });
            document.getElementById('deck').addEventListener('click', drawCard);
            document.getElementById('spreadDeck').addEventListener('click', drawSpread);
            document.getElementById('modalClose').addEventListener('click', closeModal);
            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('modal')) closeModal();
            });
            document.getElementById('favoriteBtn').addEventListener('click', toggleFavorite);
            document.getElementById('shareBtn').addEventListener('click', shareCard);
            document.getElementById('modalNote').addEventListener('blur', saveNote);
            document.getElementById('dailyBtn').addEventListener('click', showDailyCard);
            document.querySelectorAll('.library-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    const tabName = this.dataset.tab;
                    document.querySelectorAll('.library-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    document.querySelectorAll('.library-section').forEach(s => s.classList.remove('active'));
                    const target = document.getElementById('lib-' + tabName);
                    if (target) target.classList.add('active');
                });
            });
            document.getElementById('libraryModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('libraryModal')) closeLibrary();
            });
        }

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('[data-view]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });
            document.querySelectorAll('.view-section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(view + 'View').classList.add('active');
            if (view === 'history') renderHistory();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('[data-filter]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderGrid();
        }

        // ============================================================
        //  4. 牌库渲染 + 详情
        // ============================================================
        function renderGrid() {
            const grid = document.getElementById('cardGrid');
            let cards = TAROT_DATA;
            if (currentFilter !== 'all') {
                cards = cards.filter(c => c.type === currentFilter);
            }
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm) {
                cards = cards.filter(c => c.name.toLowerCase().includes(searchTerm));
            }
            grid.innerHTML = cards.map(card => {
                const isFav = favorites.includes(card.id);
                const dual = getDualElements(card);
                const elementHtml = dual.secondary ?
                    `<div class="card-elements"><span class="element-tag element-${ELEMENT_MAP[dual.primary].class}">${ELEMENT_MAP[dual.primary].icon}</span><span class="element-tag element-${ELEMENT_MAP[dual.secondary].class}">${ELEMENT_MAP[dual.secondary].icon}</span></div>` :
                    `<div class="card-elements"><span class="element-tag element-${ELEMENT_MAP[dual.primary].class}">${ELEMENT_MAP[dual.primary].icon} ${dual.primary}</span></div>`;
                return `
                        <div class="card ${isFav ? 'favorite' : ''}" onclick="openCard(${card.id})">
                            <div class="card-img">
                                <img src="${card.imgUrl}" alt="${card.name}" loading="lazy" 
                                    onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'card-emoji\\'>${card.emoji}</span>'">
                            </div>
                            <div class="card-name">${card.name}</div>${elementHtml}
                        </div>
                    `;
            }).join('');
        }

        function openCard(id, isReversed = false) {
            currentPosition = isReversed ? "reversed" : "upright";
            currentCard = TAROT_DATA.find(c => c.id === id);
            if (!currentCard) return;
            const img = document.getElementById('modalImg');
            img.src = currentCard.imgUrl;
            img.onerror = function() {
                this.style.display = 'none';
                this.parentElement.innerHTML =
                    `<div style="font-size:5rem;text-align:center;padding:2rem;">${currentCard.emoji}</div>`;
            };
            img.style.display = 'block';
            renderElementDisplay(currentCard);
            document.getElementById('modalTitle').innerHTML = `${currentCard.emoji} ${currentCard.name}`;
            document.getElementById('modalInfo').innerHTML = `
                    <div class="info-item"><div class="info-label">元素</div>${currentCard.element}</div>
                    <div class="info-item"><div class="info-label">数字</div>${currentCard.number}</div>
                    <div class="info-item"><div class="info-label">类别</div>${getTypeName(currentCard.type)}</div>
                    <div class="info-item"><div class="info-label">视觉焦点</div>${currentCard.highlight}</div>
                `;
            switchPosition(currentPosition);
            const favBtn = document.getElementById('favoriteBtn');
            favBtn.textContent = favorites.includes(currentCard.id) ? '★ 已收藏' : '☆ 收藏';
            favBtn.classList.toggle('active', favorites.includes(currentCard.id));
            document.getElementById('modalNote').value = notes[currentCard.id] || '';
            document.getElementById('modal').classList.add('active');
            renderRelatedCards(currentCard);
        }

        function renderElementDisplay(card) {
            const dual = getDualElements(card);
            let html = '<h4>🔮 元素构成</h4>';
            if (dual.secondary) {
                html += `<div class="element-pair">
                        <div class="element-box element-${ELEMENT_MAP[dual.primary].class}">${ELEMENT_MAP[dual.primary].icon} 主元素：${dual.primary}</div>
                        <span style="color:var(--text2)">+</span>
                        <div class="element-box element-${ELEMENT_MAP[dual.secondary].class}">${ELEMENT_MAP[dual.secondary].icon} 次元素：${dual.secondary}</div>
                    </div>
                    <div class="element-mix-desc">${getMixElementDesc(dual.primary, dual.secondary)}</div>`;
            } else {
                html += `<div class="element-pair">
                        <div class="element-box element-${ELEMENT_MAP[dual.primary].class}">${ELEMENT_MAP[dual.primary].icon} ${dual.primary}元素</div>
                    </div>
                    <div class="element-mix-desc">纯粹的${dual.primary}元素能量</div>`;
            }
            document.getElementById('elementDisplay').innerHTML = html;
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            currentCard = null;
        }

        function closeModalScroll() {
            const scrollPos = window.scrollY;
            document.getElementById('modal').classList.remove('active');
            currentCard = null;
            setTimeout(() => window.scrollTo({ top: scrollPos, behavior: 'auto' }), 10);
        }

        function toggleFavorite() {
            if (!currentCard) return;
            const idx = favorites.indexOf(currentCard.id);
            if (idx > -1) {
                favorites.splice(idx, 1);
                showToast('已取消收藏');
            } else {
                favorites.push(currentCard.id);
                showToast('已收藏');
            }
            localStorage.setItem('tarot_favorites', JSON.stringify(favorites));
            const favBtn = document.getElementById('favoriteBtn');
            favBtn.textContent = favorites.includes(currentCard.id) ? '★ 已收藏' : '☆ 收藏';
            favBtn.classList.toggle('active', favorites.includes(currentCard.id));
            renderGrid();
        }

        function shareCard() {
            if (!currentCard) return;
            const posText = currentPosition === 'reversed' ? '逆位' : '正位';
            const text =
                `【${currentCard.name}·${posText}】${currentPosition === 'reversed' ? currentCard.reverseDesc : currentCard.desc}`;
            if (navigator.share) {
                navigator.share({ title: currentCard.name, text, url: window.location.href });
            } else {
                navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板'));
            }
        }

        function saveNote() {
            if (!currentCard) return;
            notes[currentCard.id] = document.getElementById('modalNote').value;
            localStorage.setItem('tarot_notes', JSON.stringify(notes));
            showToast('备注已保存');
        }

        // ============================================================
        //  5. 符号关联
        // ============================================================
        function renderRelatedCards(card) {
            const container = document.getElementById('relatedCards');
            const grid = document.getElementById('relatedGrid');
            const hits = tarotSymbols.filter(s => s.cards.includes(card.name));
            if (!hits.length) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'block';
            grid.innerHTML = hits.map(s => {
                const isLink = s.type === '关联库';
                const others = s.cards.filter(n => n !== card.name).join(' / ');
                return `
                        <div class="symbol-chip ${isLink ? 'chip-link' : 'chip-material'}"
                             onclick="showSymbolCard('${s.symbol}')">
                            <div class="chip-icon">${isLink ? '🔗' : '🎨'}</div>
                            <div class="chip-text">
                                <div class="chip-name">${s.symbol}</div>
                                <div class="chip-type">${s.type}</div>
                            </div>
                            <div class="chip-others">${others}</div>
                        </div>
                    `;
            }).join('');
        }

        function showSymbolCard(symbolName) {
            const s = tarotSymbols.find(x => x.symbol === symbolName);
            if (!s) return;
            const isLink = s.type === '关联库';
            const accent = isLink ? 'var(--copper)' : 'var(--text2)';
            const html = `
                    <div class="symbol-modal" onclick="this.remove()">
                        <div class="symbol-modal-inner ${isLink ? 'symbol-related' : 'symbol-material'}" onclick="event.stopPropagation()">
                            <div class="symbol-modal-header" style="color:${accent}">
                                ${isLink ? '🔗 关联符号' : '🎨 画面素材'}
                            </div>
                            <h3 style="color:var(--text);margin:.3rem 0 .5rem;font-size:1.3rem">${s.symbol}</h3>
                            <p class="symbol-meaning">${s.meaning}</p>
                            <div class="symbol-hint">
                                ${isLink
                                    ? '📖 关联库：用于理解牌与牌之间的叙事联系'
                                    : '🖌️ 素材库：仅作为画面元素与创作参考'}
                            </div>
                            <hr style="border:0;border-top:1px solid var(--border);margin:.8rem 0">
                            <div style="font-size:.75rem;color:var(--gold);margin-bottom:.4rem">
                                出现牌面（${s.cards.length}张）
                            </div>
                            <div class="symbol-tags">
                                ${s.cards.map(name => {
                                    const c = TAROT_DATA.find(x => x.name === name);
                                    return `<span class="symbol-tag">${c ? c.emoji : ''} ${name}</span>`;
                                }).join('')}
                            </div>
                            <button class="close-scroll-btn" onclick="this.closest('.symbol-modal').remove()">
                                ✕ 合上符号卷轴
                            </button>
                        </div>
                    </div>
                `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        // ============================================================
        //  6. 单张抽牌 + 历史
        // ============================================================
        function drawCard() {
            const deck = document.getElementById('deck');
            deck.classList.add('shuffling');
            setTimeout(() => {
                deck.classList.remove('shuffling');
                const randomCard = TAROT_DATA[Math.floor(Math.random() * TAROT_DATA.length)];
                const isReversed = Math.random() > 0.5;
                const result = document.getElementById('drawResult');
                addToHistory(randomCard, isReversed);
                const posClass = isReversed ? "reversed" : "";
                const badge = isReversed ? '<div class="reversed-badge">逆位</div>' : "";
                result.innerHTML = `
                        <div class="draw-card ${posClass}">
                            <div class="card" onclick="openCard(${randomCard.id}, ${isReversed})" style="position:relative;">${badge}
                                <div class="card-img">
                                    <img src="${randomCard.imgUrl}" alt="${randomCard.name}" 
                                        onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'card-emoji\\'>${randomCard.emoji}</span>'">
                                </div>
                                <div class="card-name">${randomCard.name} ${isReversed ? '↓' : '↑'}</div>
                            </div>
                        </div>
                    `;
            }, 500);
        }

        function addToHistory(card, isReversed = false) {
            const record = {
                cardId: card.id,
                isReversed: isReversed,
                cardName: card.name,
                cardEmoji: card.emoji,
                cardImg: card.imgUrl,
                timestamp: new Date().toISOString()
            };
            history.unshift(record);
            if (history.length > 50) history = history.slice(0, 50);
            localStorage.setItem('tarot_history', JSON.stringify(history));
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if (history.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:var(--text2);padding:2rem;">暂无占卜记录</div>';
                return;
            }
            list.innerHTML = history.map(record => {
                const date = new Date(record.timestamp);
                const dateStr =
                    `${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${date.getMinutes().toString().padStart(2,'0')}`;
                const revClass = record.isReversed ? 'reversed' : '';
                const revBadge = record.isReversed ? '↓逆位' : '';
                return `
                        <div class="history-item" onclick="openCard(${record.cardId}, ${record.isReversed || false})">
                            <div class="history-date">${dateStr}</div>
                            <div class="history-cards">
                                <div class="history-card-mini ${revClass}">
                                    <img src="${record.cardImg}" alt="${record.cardName}${revBadge}" 
                                        onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\\'font-size:1.5rem;text-align:center;line-height:75px\\'>${record.cardEmoji}</div>'">
                                </div>
                                <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:center;">
                                    <div style="color:var(--text);font-weight:bold;">${record.cardName} ${revBadge}</div>
                                    <div style="color:var(--text2);font-size:0.7rem;">点击查看详情</div>
                                </div>
                            </div>
                        </div>
                    `;
            }).join('');
        }

        // ============================================================
        //  7. 每日一抽
        // ============================================================
        function checkDailyCard() {
            const today = new Date().toDateString();
            if (dailyCard && dailyCard.date === today) {} else {
                dailyCard = null;
                localStorage.removeItem('tarot_daily');
            }
        }

        function showDailyCard() {
            const today = new Date().toDateString();
            if (dailyCard && dailyCard.date === today) {
                const card = TAROT_DATA.find(c => c.id === dailyCard.cardId);
                if (card) {
                    openCard(card.id, dailyCard.isReversed);
                    showToast('今日已抽牌，再次查看');
                } else {
                    dailyCard = null;
                    localStorage.removeItem('tarot_daily');
                }
                return;
            }
            const card = TAROT_DATA[Math.floor(Math.random() * TAROT_DATA.length)];
            const isReversed = Math.random() > 0.5;
            dailyCard = { date: today, cardId: card.id, isReversed: isReversed };
            localStorage.setItem('tarot_daily', JSON.stringify(dailyCard));
            openCard(card.id, isReversed);
            showToast('🌅 今日指引已揭晓');
        }

        // ============================================================
        //  8. 牌阵系统（核心升级）
        // ============================================================
        function drawSpread() {
            const deck = document.getElementById('spreadDeck');
            deck.classList.add('shuffling');
            const def = SPREAD_DEFS[currentSpread];
            document.getElementById('spreadCount').textContent = def.count + ' 张';

            setTimeout(() => {
                deck.classList.remove('shuffling');
                const drawn = [];
                for (let i = 0; i < def.count; i++) {
                    const c = TAROT_DATA[Math.floor(Math.random() * TAROT_DATA.length)];
                    const rev = Math.random() > 0.5;
                    drawn.push({ card: c, reversed: rev });
                    addToHistory(c, rev);
                }

                const container = document.getElementById('spreadResult');
                container.innerHTML = drawn.map((item, idx) => {
                    const posClass = item.reversed ? "reversed" : "";
                    const badge = item.reversed ? '<div class="reversed-badge">逆位</div>' : "";
                    const label = def.slots[idx] || `位置${idx+1}`;
                    const meaning = def.meanings[idx] || '';
                    return `
                            <div class="spread-slot">
                                <div class="draw-card ${posClass}">
                                    <div class="card" onclick="openCard(${item.card.id}, ${item.reversed})" style="position:relative;">${badge}
                                        <div class="card-img">
                                            <img src="${item.card.imgUrl}" alt="${item.card.name}" 
                                                onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'card-emoji\\'>${item.card.emoji}</span>'">
                                        </div>
                                        <div class="card-name">${item.card.name}</div>
                                    </div>
                                </div>
                                <div class="spread-label">${label}</div>
                                <div class="spread-meaning">${meaning}</div>
                            </div>
                        `;
                }).join('');

                // 生成基础解读
                const interp = document.getElementById('spreadInterp');
                interp.style.display = 'block';
                let html = `<strong>📖 ${def.label} · 基础解读</strong><br><br>`;
                drawn.forEach((item, idx) => {
                    const label = def.slots[idx] || `位置${idx+1}`;
                    const desc = item.reversed ? item.card.reverseDesc : item.card.desc;
                    const pos = item.reversed ? '逆位' : '正位';
                    html +=
                        `<span class="pos-tag">${label}</span> <strong>${item.card.name}</strong>（${pos}）— ${desc}<br><br>`;
                });
                html += `<span style="color:var(--text2);font-size:0.8rem;">💡 点击单牌查看完整释义 · 下方可召唤AI深度解读</span>`;
                interp.innerHTML = html;

                // 自动展开 AI 面板（如果有key）
                const aiPanel = document.getElementById('aiPanel');
                const key = localStorage.getItem('tarot_api_key');
                if (key && key.startsWith('sk-')) {
                    aiPanel.classList.add('active');
                    document.getElementById('aiContent').innerHTML =
                        `<span class="ai-loading">✨ 正在召唤智慧之灵…</span>`;
                    // 自动调用 AI
                    callAI(drawn);
                } else {
                    aiPanel.classList.remove('active');
                }

            }, 500);
        }

        function callAI(drawnCards) {
            const key = localStorage.getItem('tarot_api_key');
            const base = localStorage.getItem('tarot_api_base') || 'https://api.deepseek.com/v1';
            const model = localStorage.getItem('tarot_model') || 'deepseek-chat';

            if (!key || !key.startsWith('sk-')) {
                document.getElementById('aiContent').innerHTML =
                    '<span style="color:#d9534f;">⚠️ 请先在上方配置有效的 API Key</span>';
                document.getElementById('aiStatus').textContent = '❌ 缺少 API Key';
                document.getElementById('aiStatus').className = 'ai-status err';
                return;
            }

            // 如果没传牌，尝试从界面读取
            let cards = drawnCards;
            if (!cards) {
                const container = document.getElementById('spreadResult');
                const slots = container.querySelectorAll('.spread-slot');
                if (slots.length) {
                    cards = [];
                    slots.forEach(slot => {
                        const nameEl = slot.querySelector('.card-name');
                        if (nameEl) {
                            const name = nameEl.textContent.trim();
                            const card = TAROT_DATA.find(c => c.name === name);
                            if (card) {
                                const isRev = slot.querySelector('.reversed-badge') !== null;
                                cards.push({ card, reversed: isRev });
                            }
                        }
                    });
                }
            }

            if (!cards || cards.length === 0) {
                document.getElementById('aiContent').innerHTML =
                    '<span style="color:#d9534f;">⚠️ 请先展开牌阵再召唤 AI</span>';
                return;
            }

            const def = SPREAD_DEFS[currentSpread];
            const slots = def.slots;
            const meanings = def.meanings;

            // 构建牌阵描述
            let cardDesc = '';
            cards.forEach((item, idx) => {
                const label = slots[idx] || `位置${idx+1}`;
                const pos = item.reversed ? '逆位' : '正位';
                const desc = item.reversed ? item.card.reverseDesc : item.card.desc;
                cardDesc += `- ${label}（${pos}）：${item.card.name} — ${desc}\n`;
            });

            const prompt = `你是一位精通塔罗牌的资深占卜师，擅长将牌阵与人生智慧结合。请为以下牌阵提供深度解读，语言诗意且富有洞察力，约200-300字。

牌阵：${def.label}（${def.desc}）
牌面：
${cardDesc}

请从整体能量、各位置关联、以及给提问者的建议三个层面展开解读。`;

            const aiContent = document.getElementById('aiContent');
            aiContent.innerHTML = `<span class="ai-loading">✨ 正在召唤智慧之灵…</span>`;

// 调用后端代理 (Vercel Serverless Function)
fetch('/api/chat', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json'
        // ⚠️ 这里不再带 Authorization，Key 已存在 Vercel 环境变量中
    },
    body: JSON.stringify({
        messages: [
            { role: 'system', content: '你是一位深谙塔罗智慧的解读者，语言富有诗意与洞察力，帮助人们从牌阵中获得启示。' },
            { role: 'user', content: prompt }
        ]
    })
})                .then(res => {
                    if (!res.ok) {
                        return res.text().then(text => { throw new Error(`API 错误 (${res.status}): ${text}`); });
                    }
                    return res.json();
                })
                .then(data => {
                    const content = data.choices?.[0]?.message?.content || '（无回应）';
                    aiContent.innerHTML = content.replace(/\n/g, '<br>');
                    document.getElementById('aiStatus').textContent = '✅ 解读完成';
                    document.getElementById('aiStatus').className = 'ai-status ok';
                })
                .catch(err => {
                    console.error('AI 调用失败:', err);
                    aiContent.innerHTML =
                        `<span style="color:#d9534f;">❌ 召唤失败：${err.message || '请检查网络或 API 配置'}</span>`;
                    document.getElementById('aiStatus').textContent = '❌ 调用失败';
                    document.getElementById('aiStatus').className = 'ai-status err';
                });
        }

        function searchSymbols() {
            const query = document.getElementById('symbolSearchInput').value.toLowerCase().trim();
            const results = document.getElementById('symbolResults');
            if (!query) {
                results.innerHTML =
                    '<div style="text-align:center;color:var(--text2);padding:1rem;">输入关键词搜索符号、牌名或含义</div>';
                return;
            }
            let matches = SYMBOL_DATABASE.filter(s => {
                if (currentSymbolFilter !== 'all') {
                    const catSymbols = SYMBOL_CATEGORIES[currentSymbolFilter] || [];
                    if (!catSymbols.some(cs => s.symbol.includes(cs))) return false;
                }
                return s.symbol.toLowerCase().includes(query) ||
                    s.cards.some(c => c.name.toLowerCase().includes(query));
            });
            const cardMatches = TAROT_DATA.filter(c =>
                c.desc.toLowerCase().includes(query) ||
                c.highlight.toLowerCase().includes(query) ||
                c.name.toLowerCase().includes(query) ||
                (c.reverseDesc && c.reverseDesc.toLowerCase().includes(query))
            ).map(c => ({
                symbol: c.highlight.split('·')[0] || c.name,
                cards: [{ id: c.id, name: c.name }],
                matchReason: c.desc.includes(query) ? '描述' : '牌名'
            }));
            const allMatches = [...matches, ...cardMatches];
            if (allMatches.length === 0) {
                results.innerHTML = '<div style="text-align:center;color:var(--text2);padding:1rem;">未找到相关结果</div>';
                return;
            }
            results.innerHTML = allMatches.slice(0, 20).map(m => {
                const highlightQuery = (text) => {
                    if (!query) return text;
                    const regex = new RegExp(`(${query})`, 'gi');
                    return text.replace(regex, '<span class="symbol-highlight">$1</span>');
                };
                return `
                        <div class="symbol-result" onclick="closeLibrary();openCard(${m.cards[0].id})">
                            <div class="symbol-match">${highlightQuery(m.symbol)} ${m.matchReason ? `<span style="font-size:0.65rem;color:var(--text2);">(${m.matchReason})</span>` : ''}</div>
                            <div style="color:var(--text2);font-size:0.75rem;margin-top:0.3rem;">
                                出现在：${m.cards.map(c => `<span style="color:var(--text);cursor:pointer;">${highlightQuery(c.name)}</span>`).join('、')}
                            </div>
                        </div>
                    `;
            }).join('');
        }
